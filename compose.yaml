services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-before-deploying}
            DATABASE_URL: file:/app/data/workshop.db
            ENABLE_MULTIPLAYER: "true"
            NITRO_HOST: 0.0.0.0
            NITRO_PORT: 3000
            NODE_ENV: production
        ports:
            - "${APP_PORT:-3000}:3000"
        volumes:
            - workshop-data:/app/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

volumes:
    workshop-data:
